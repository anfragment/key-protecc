version: "3"

vars:
  BINARY: key-protecc

tasks:
  build:
    desc: Build the binary.
    env:
      CGO_ENABLED: "1"
    cmds:
      - go build -o {{.BINARY}} .

  certtest:
    desc: Run the create/sign/verify self-test locally.
    env:
      CGO_ENABLED: "1"
    cmds:
      - go build -tags kpsoftkey -o {{.BINARY}} .
      - ./{{.BINARY}} certtest

  bench:
    desc: Benchmark certificate signing (key create/delete excluded from timing).
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -tags kpsoftkey -run '^$' -bench . -benchmem .

  vet:
    desc: Vet the module.
    cmds:
      - go vet ./...

  clean:
    desc: Remove build artifacts.
    cmds:
      - rm -f {{.BINARY}}
